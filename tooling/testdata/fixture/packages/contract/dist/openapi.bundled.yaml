openapi: 3.0.3
info:
  title: Fixture — proyek contoh
  version: 1.0.0
  description: 'Proyek fixture untuk `standard doctor`/`standard verify`/`standard gate`. Bukan proyek produksi — tiga operasi di satu tag, cukup untuk melatih pipa generasi (gen dto, gen module) DAN seluruh gate lapis kontrak/backend atas sebuah kontrak yang benar-benar berbentuk seperti kontrak nyata: envelope bersama, permission per operasi, satu operasi berpaginasi, dan satu operasi by-ID (yang justru kelas paling rawan bocor lintas-penyewa — T-02/T-05/T-07).'
servers:
  - url: /api
tags:
  - name: contoh
    description: Tag contoh — daftar berpaginasi + ambil-satu-by-ID + buat, dipakai sebagai fixture standard verify/gate.
paths:
  /contoh:
    get:
      operationId: getContoh
      tags:
        - contoh
      summary: Daftar contoh, berpaginasi
      security:
        - bearerAuth: []
      x-permission: CONTOH_READ
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Daftar contoh.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    required:
                      - data
                      - metaData
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Contoh'
                      metaData:
                        $ref: '#/components/schemas/ContohMetaData'
        '401':
          description: Belum terautentikasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '403':
          description: Terautentikasi tapi tak berhak.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
    post:
      operationId: postContoh
      tags:
        - contoh
      summary: Buat contoh baru
      security:
        - bearerAuth: []
      x-permission: CONTOH_CREATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContohCreateRequest'
      responses:
        '201':
          description: Contoh dibuat.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/Contoh'
        '400':
          description: Validasi gagal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '401':
          description: Belum terautentikasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '403':
          description: Terautentikasi tapi tak berhak.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '409':
          description: Nama sudah dipakai.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
  /contoh/{contohId}:
    get:
      operationId: getContohById
      tags:
        - contoh
      summary: Ambil satu contoh lewat ID
      security:
        - bearerAuth: []
      x-permission: CONTOH_READ
      parameters:
        - name: contohId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Satu contoh.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/Contoh'
        '401':
          description: Belum terautentikasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '403':
          description: Terautentikasi tapi tak berhak.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '404':
          description: 'Tidak ditemukan — baik memang tidak ada, maupun milik penyewa lain (T-05: 403 di sini akan JADI existence oracle lintas-penyewa, jadi dilarang).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Contoh:
      type: object
      required:
        - id
        - nama
        - dibuatPada
      properties:
        id:
          type: string
          format: uuid
        nama:
          type: string
        dibuatPada:
          type: string
          format: date-time
    ContohCreateRequest:
      type: object
      description: Badan permintaan — field opsional memakai *optional*, TIDAK PERNAH nullable (C-04).
      required:
        - nama
      properties:
        nama:
          type: string
          minLength: 1
          maxLength: 120
    ContohMetaData:
      type: object
      required:
        - pagination
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
    EnvelopeStatus:
      type: string
      description: Status envelope sukses — nilai tunggal, dan itu disengaja (lihat C-01).
      enum:
        - success
    Pagination:
      type: object
      description: Komponen paginasi BERSAMA — satu bentuk untuk seluruh operasi list.
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    EnvelopeMeta:
      type: object
      description: metaData membawa HANYA paginasi (C-01) — field kedua apa pun dilarang.
      required:
        - pagination
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
    EnvelopeSuccess:
      type: object
      description: Bentuk sukses TUNGGAL untuk seluruh respons JSON (C-01). Operasi menggabungkannya lewat allOf dan menambahkan bentuk `data` miliknya sendiri di bagian kedua.
      required:
        - status
        - message
        - data
      properties:
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        message:
          type: string
          description: Kalimat untuk manusia, bukan untuk cabang logika klien.
        data: {}
        metaData:
          $ref: '#/components/schemas/EnvelopeMeta'
    EnvelopeErrorStatus:
      type: string
      description: Status envelope gagal — nilai tunggal, terpisah dari EnvelopeStatus.
      enum:
        - failed
    EnvelopeError:
      type: object
      description: Bentuk gagal TUNGGAL untuk seluruh respons JSON (C-01). Tidak ada `data` di sini — itu mutlak, bukan detail.
      required:
        - status
        - code
        - message
      properties:
        status:
          $ref: '#/components/schemas/EnvelopeErrorStatus'
        code:
          type: string
          description: Kode dari katalog tertutup (C-02) — bukan teks bebas.
        message:
          type: string
        errors:
          type: array
          description: Hanya muncul pada respons validasi.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                description: Jalur field, notasi titik/kurung — string, bukan larik.
              message:
                type: string
